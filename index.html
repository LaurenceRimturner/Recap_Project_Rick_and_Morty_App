<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Rick and Morty Character Log</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <a href="#main" class="backToTopBtn" aria-label="Back to top"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="var(--primary-color)"
      >
        <path
          d="M440-80v-647L256-544l-56-56 280-280 280 280-56 57-184-184v647h-80Z"
        /></svg
    ></a>
    <img
      class="Logo"
      draggable="false"
      src="./assets/Rick_and_Morty-logo.png"
      alt="Rick and Morty Logo"
    />
    <main id="main">
      <div class="search-bar-container" data-js="search-bar-container">
        <form action="" class="search-bar" data-js="search-bar">
          <input
            name="query"
            class="search-bar__input"
            type="text"
            placeholder="search characters"
            aria-label="character name"
          />
          <button class="search-bar__button" aria-label="search for character">
            <img
              class="search-bar__icon"
              src="assets/magnifying-glass.png"
              alt=""
            />
          </button>
        </form>
      </div>
      <ul class="card-container" data-js="card-container"></ul>
    </main>
    <nav class="navigation" data-js="navigation">
      <button class="button button--prev" data-js="button-prev">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="var(--primary-color)"
        >
          <path
            d="M360-200 80-480l280-280 56 56-183 184h647v80H233l184 184-57 56Z"
          />
        </svg>
      </button>
      <span class="navigation__pagination" data-js="pagination">1 / 1</span>
      <button class="button button--next" data-js="button-next">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="var(--primary-color)"
        >
          <path
            d="m600-200-57-56 184-184H80v-80h647L544-704l56-56 280 280-280 280Z"
          />
        </svg>
      </button>
    </nav>
  </body>
</html>
